version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "composer"
    directory: "/tests/unit"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # PHPUnit 12 needs PHP 8.3 and 13 needs PHP 8.4; the tests run on PHP 8.2,
      # the oldest version the plugin supports (see tests/README.md).
      - dependency-name: "phpunit/phpunit"
        versions: [">=12"]
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  # Base images are pinned by digest (OpenSSF Scorecard: Pinned-Dependencies); this keeps the
  # digests and patch/minor tags current. Majors (a new Node, PHP, … line) are a decision, not an update.
  - package-ecosystem: "docker"
    directories:
      - "/demo"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
