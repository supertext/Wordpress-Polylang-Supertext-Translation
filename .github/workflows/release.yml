name: Release on minor version bump

# Cuts a GitHub release + installable plugin zip only when a new X.Y line starts
# (1.0.x -> 1.1.0, 1.x -> 2.0.0): if any tag vX.Y.* exists, the run releases
# nothing, so patch bumps (1.1.0 -> 1.1.1) only ship with the next minor. The plugin
# header's "Version:" and SUPERTEXT_POLYLANG_VERSION must match, or the run fails.
# Never tag by hand.

on:
  push:
    branches: [ main ]
    paths: [ 'supertext-polylang.php' ]   # version lives here
  workflow_dispatch:                        # allow manual runs too

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create tags + releases via GITHUB_TOKEN (gh release create, no git push)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need existing tags for the gate
          persist-credentials: false

      - name: Read version and decide whether to release
        id: check
        run: |
          set -euo pipefail
          VERSION=$(grep -oP "SUPERTEXT_POLYLANG_VERSION',\s*'\K[0-9]+\.[0-9]+\.[0-9]+" supertext-polylang.php | head -1 || true)
          if [ -z "${VERSION:-}" ]; then
            echo "::error::Could not read SUPERTEXT_POLYLANG_VERSION from supertext-polylang.php"
            exit 1
          fi
          HEADER=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' supertext-polylang.php | head -1 || true)
          if [ "$HEADER" != "$VERSION" ]; then
            echo "::error file=supertext-polylang.php::Version mismatch: header says '$HEADER', SUPERTEXT_POLYLANG_VERSION says '$VERSION'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          LINE="${VERSION%.*}"   # X.Y
          if [ -n "$(git tag -l "v${LINE}.*")" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "The ${LINE} line is already released: patch versions (v$VERSION) release nothing."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "New ${LINE} line: will publish v$VERSION."
          fi

      - name: Build installable plugin zip
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/supertext-polylang
          cp supertext-polylang.php README.md build/supertext-polylang/
          cp -r includes assets languages build/supertext-polylang/
          ( cd build && zip -qr "../supertext-polylang-${VERSION}.zip" supertext-polylang )
          ls -l "supertext-polylang-${VERSION}.zip"

      - name: Publish GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "supertext-polylang-${VERSION}.zip" \
            --title "v${VERSION}" \
            --generate-notes
